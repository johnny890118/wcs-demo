name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment composition
        run: docker compose --env-file infra/compose.env.example -f infra/compose.production.yml config --quiet
      - name: Build OCI images
        run: docker compose --env-file infra/compose.env.example -f infra/compose.production.yml build
      - name: Start and verify production-like stack
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -p warehouse-platform-ci --env-file infra/compose.env.example -f infra/compose.production.yml down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose -p warehouse-platform-ci --env-file infra/compose.env.example -f infra/compose.production.yml up -d --wait postgres api web
          curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/health/ready
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/platform
          docker compose -p warehouse-platform-ci --env-file infra/compose.env.example -f infra/compose.production.yml --profile demo-seed run --rm seed-demo
          test "$(docker compose -p warehouse-platform-ci --env-file infra/compose.env.example -f infra/compose.production.yml exec -T postgres psql -U warehouse -d warehouse -Atc 'select count(*) from schema_migrations')" = "6"

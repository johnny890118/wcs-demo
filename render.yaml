services:
  - type: web
    name: warehouse-platform-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    dockerCommand: /usr/local/bin/start-warehouse-api
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_SERVICE_ID
        value: warehouse-web
      - key: API_SERVICE_TOKEN
        sync: false
      - key: API_SERVICE_PERMISSIONS
        value: operations.view,inbound.create,outbound.create,transport.execute,alarm.inject,alarm.acknowledge,alarm.recover
      - key: OUTBOX_POLL_INTERVAL_MS
        value: 1000
      - key: API_RATE_LIMIT_MAX
        value: 120
      - key: API_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: API_TRUST_PROXY_HOPS
        value: 1

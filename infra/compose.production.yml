name: warehouse-platform

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    image: warehouse-platform-api:${IMAGE_TAG:-local}
    restart: "no"
    command: ["node", "dist/runtime/database/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-warehouse}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    image: warehouse-platform-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-warehouse}
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_SERVICE_ID: ${API_SERVICE_ID:-warehouse-web}
      SIMULATOR_HEARTBEAT_MS: ${SIMULATOR_HEARTBEAT_MS:-10000}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?API_SERVICE_TOKEN is required}
      API_SERVICE_PERMISSIONS: ${API_SERVICE_PERMISSIONS:-access.resolve,audit.view,operations.view,inbound.create,outbound.create,transport.execute,alarm.inject,alarm.acknowledge,alarm.recover}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-120}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_TRUST_PROXY_HOPS: ${API_TRUST_PROXY_HOPS:-0}
      HUMAN_SESSION_TTL_SECONDS: ${HUMAN_SESSION_TTL_SECONDS:-28800}
      HUMAN_LOGIN_FAILURE_LIMIT: ${HUMAN_LOGIN_FAILURE_LIMIT:-5}
      HUMAN_LOGIN_FAILURE_WINDOW_SECONDS: ${HUMAN_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      HUMAN_LOGIN_THROTTLE_SECONDS: ${HUMAN_LOGIN_THROTTLE_SECONDS:-900}
      SWP_LIFECYCLE_ENVIRONMENT: ${SWP_LIFECYCLE_ENVIRONMENT:?SWP_LIFECYCLE_ENVIRONMENT is required}
      SWP_DEPLOYMENT_PROFILE: ${SWP_DEPLOYMENT_PROFILE:?SWP_DEPLOYMENT_PROFILE is required}
      SWP_EQUIPMENT_SOURCE: ${SWP_EQUIPMENT_SOURCE:?SWP_EQUIPMENT_SOURCE is required}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    image: warehouse-platform-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:?DEMO_ADMIN_USERNAME is required}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD is required}
      HUMAN_SESSION_TTL_SECONDS: ${HUMAN_SESSION_TTL_SECONDS:-28800}
      HUMAN_SESSION_REVOCATION_ATTEMPTS: ${HUMAN_SESSION_REVOCATION_ATTEMPTS:-3}
      HUMAN_SESSION_READ_FRESHNESS_SECONDS: ${HUMAN_SESSION_READ_FRESHNESS_SECONDS:-900}
      HUMAN_SESSION_REVOCATION_RETRY_MS: ${HUMAN_SESSION_REVOCATION_RETRY_MS:-250}
      # These values configure only the optional anonymous public-demo adapter.
      # Human warehouse grants are resolved from persisted assignments.
      DEMO_WAREHOUSE_ID: ${DEMO_WAREHOUSE_ID:-10000000-0000-4000-8000-000000000001}
      DEMO_WAREHOUSE_CODE: ${DEMO_WAREHOUSE_CODE:-DEMO}
      DEMO_WAREHOUSE_NAME: ${DEMO_WAREHOUSE_NAME:-Deterministic Demo Warehouse}
      SWP_LIFECYCLE_ENVIRONMENT: ${SWP_LIFECYCLE_ENVIRONMENT:?SWP_LIFECYCLE_ENVIRONMENT is required}
      SWP_DEPLOYMENT_PROFILE: ${SWP_DEPLOYMENT_PROFILE:?SWP_DEPLOYMENT_PROFILE is required}
      SWP_EQUIPMENT_SOURCE: ${SWP_EQUIPMENT_SOURCE:?SWP_EQUIPMENT_SOURCE is required}
      INTERNAL_API_BASE_URL: http://api:3001
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true

  seed-demo:
    image: warehouse-platform-api:${IMAGE_TAG:-local}
    profiles: ["demo-seed"]
    command: ["node", "dist/runtime/database/seed-demo.mjs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-warehouse}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  backup-database:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["data-ops"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-warehouse}
      BACKUP_NAME: ${BACKUP_NAME:-unset}
    volumes:
      - ${BACKUP_DIRECTORY:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${BACKUP_NAME}" in
          *[!A-Za-z0-9._-]*|""|unset) echo "BACKUP_NAME is invalid" >&2; exit 2 ;;
        esac
        umask 077
        test ! -e "/backups/$${BACKUP_NAME}.dump"
        pg_dump --dbname="$${DATABASE_URL}" --format=custom --no-owner --no-acl --file="/backups/$${BACKUP_NAME}.dump"
        cd /backups
        sha256sum "$${BACKUP_NAME}.dump" > "$${BACKUP_NAME}.sha256"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  restore-database:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["data-ops"]
    environment:
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-unset}
      BACKUP_NAME: ${BACKUP_NAME:-unset}
      RESTORE_CONFIRMATION: ${RESTORE_CONFIRMATION:-unset}
    volumes:
      - ${BACKUP_DIRECTORY:-./backups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${BACKUP_NAME}" in
          *[!A-Za-z0-9._-]*|""|unset) echo "BACKUP_NAME is invalid" >&2; exit 2 ;;
        esac
        test "$${RESTORE_CONFIRMATION}" = "RESTORE:$${BACKUP_NAME}"
        test "$${RESTORE_DATABASE_URL}" != "unset"
        cd /backups
        sha256sum -c "$${BACKUP_NAME}.sha256"
        pg_restore --dbname="$${RESTORE_DATABASE_URL}" --clean --if-exists --exit-on-error --no-owner --no-acl "$${BACKUP_NAME}.dump"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
